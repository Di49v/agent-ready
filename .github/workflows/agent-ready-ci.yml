name: AgentReady Lab CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Test Suite, Smoke Test & Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv Package Manager
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync

      - name: Run Full Pytest Suite (114+ Tests)
        working-directory: backend
        run: uv run pytest tests/ -v

      - name: Run Automated Smoke Test & Dry Run
        working-directory: backend
        run: uv run python scripts/smoke_test.py

      - name: Run 12-Bug Benchmark Matrix (100% True Positives)
        working-directory: backend
        run: uv run python scripts/run_self_test_matrix.py

      - name: Validate OpenAPI 3.1 Export
        working-directory: backend
        run: uv run python scripts/export_openapi.py

  frontend-verification:
    name: Frontend Production Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js Production Bundle
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"

  mcp-sdk-verification:
    name: MCP Server & APIMatic SDK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build MCP Stdio Server (@agent-ready/mcp-server)
        working-directory: mcp
        run: |
          npm install
          npm run build

      - name: Build Typed TypeScript SDK (@agent-ready/sdk)
        working-directory: sdk
        run: |
          npm install
          npm run build

